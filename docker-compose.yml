# RandevunHazır — yerel geliştirme ve sunucu kurulumu
# Kullanım: docker compose up -d        (API: http://localhost:8080, veritabanı: localhost:14333)
# Ayarlar .env dosyasından okunur (bkz. .env.example); sunucuda şifreleri mutlaka değiştirin.
services:
  db:
    # SQL Server 2022 (canlı sunucudaki sürüm). Apple Silicon'da Rosetta ile çalışır.
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # En az 8 karakter; büyük harf, küçük harf, rakam ve simge içermeli
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-Yerel_Gelistirme_123}
    ports:
      - "${DB_PORT:-14333}:1433"
    volumes:
      - dbdata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Db: Server=db;Database=${DB_NAME:-randevuhazir};User Id=sa;Password=${DB_PASSWORD:-Yerel_Gelistirme_123};TrustServerCertificate=True
      Jwt__Key: ${JWT_KEY:-yerel-gelistirme-anahtari-en-az-32-karakter-uzunlugunda}
      Cors__Origins__0: ${CORS_ORIGIN:-http://127.0.0.1:5317}
      Cors__Origins__1: ${CORS_ORIGIN_2:-http://127.0.0.1:5318}
      # Yalnız demo/geliştirme sunucusunda true: "Demo verisini sıfırla" tüm veriyi değiştirir.
      Demo__AllowReset: ${DEMO_ALLOW_RESET:-false}
      # Giriş/şifre sıfırlama denemesi: istemci başına dakikada (gerçek sunucuda 10 kalmalı)
      RateLimit__AuthPerMinute: ${AUTH_PER_MINUTE:-10}
      # Şifre sıfırlama e-postaları: Smtp boşsa simülasyon (kod API günlüğünde görünür)
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-}
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  dbdata:
