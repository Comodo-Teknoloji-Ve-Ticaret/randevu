name: Deploy frontend to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Yayın düzeni: kök = tanıtım sitesi, /panel/ = uygulama (tarayıcı demosu), CNAME = özel alan adı
      - name: Site + panel birleştir
        run: |
          node ../site/build.mjs
          rm -rf ../_site && cp -R ../site/dist ../_site
          cp -R dist ../_site/panel
          mkdir -p ../_site/tanitim && printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=../"><a href="../">Ana sayfa</a>\n' > ../_site/tanitim/index.html
          node -e "const d=require('../site/site.config.json').domain; require('fs').writeFileSync('../_site/CNAME', new URL('https://'+d).host+'\n')"
          cat ../_site/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
